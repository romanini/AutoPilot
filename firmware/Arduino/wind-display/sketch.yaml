# Arduino sketch project file (https://arduino.github.io/arduino-cli/latest/sketch-project-file/)
#
# Defines a reproducible build "profile" for the cockpit wind display. Build with:
#
#     arduino-cli compile --profile nano        # run from this folder
#     arduino-cli upload  --profile nano -p /dev/cu.usbmodemXXXX
#
# The first compile auto-installs the core + libraries listed below, so nothing
# has to live in firmware/Arduino/libraries.
#
# NOTE: profile library lists are NOT dependency-resolved - every transitive
# dependency must be listed explicitly (that is why Adafruit BusIO is here even
# though we never #include it directly; the GFX/HX8357 drivers need it).
# Version pins are reasonable recent releases; bump with `arduino-cli lib search`.

# The ST7365P driver is NOT listed here: no maintained Adafruit-GFX driver for
# that controller exists, so Adafruit_ST7365.{h,cpp} are vendored into this
# sketch folder alongside AutoPilot.{h,cpp}. That is not a violation of the
# "libraries live in sketch.yaml" rule - the rule is about published libraries.
#
# The display unit's Time (TimeLib.h) dependency is absent on purpose: this
# sketch shows no clock, so it never converts a time_t.

profiles:
  nano:
    notes: Arduino Nano ESP32 - cockpit wind display, auto-detects HX8357 or ST7365P LCD
    fqbn: arduino:esp32:nano_nora
    platforms:
      - platform: arduino:esp32 (2.0.18-arduino.5)
    libraries:
      - Adafruit GFX Library (1.11.11)   # graphics + Fonts/* (Adafruit_GFX.h)
      - Adafruit HX8357 Library (1.1.20) # driver for the original TFT breakout
      - Adafruit BusIO (1.16.1)          # dependency of the Adafruit drivers

default_profile: nano
