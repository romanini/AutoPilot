<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="1020" height="700" role="img" aria-label="Inside the display unit: 12 V and USB feed V_in through 1N5817 diodes into the TP5100 charger and charge the LiPo only; the LiPo powers the display mainboard through the TPS61023 boost, which feeds the button board over a 2x10 ribbon and then either an HX8357 module or the LCD carrier over an 8-pin JST-XH.">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .ttl  { font-size: 14px; font-weight: 700; fill: #0f172a; letter-spacing: .5px; }
      .sub  { font-size: 12px; fill: #475569; }
      .ext  { font-size: 12.5px; fill: #334155; }
      .lbl  { font-size: 11.5px; fill: #64748b; }
      .node { font-size: 12px; font-weight: 700; fill: #b45309; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .note { font-size: 12px; font-style: italic; fill: #b45309; }
      .ln   { stroke: #94a3b8; stroke-width: 1.6; fill: none; }
      .arw  { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1020" height="700" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="1019" height="699" fill="none" stroke="#e2e8f0"/>

  <!-- charging path -->
  <rect x="24" y="26" width="900" height="140" rx="10" fill="#fffaf1" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="note" x="44" y="48">Charging path only — 12 V and USB never power the board</text>

  <text class="ext" x="44"  y="80"  >Boat 12 V</text>
  <text class="ext" x="44"  y="128" >USB 5 V</text>
  <path class="arw" d="M130,76 H176"/>
  <path class="arw" d="M130,124 H176"/>

  <rect x="178" y="58" width="120" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text class="sub" x="238" y="81" text-anchor="middle">D1 · 1N5817</text>
  <rect x="178" y="106" width="120" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text class="sub" x="238" y="129" text-anchor="middle">D2 · 1N5817</text>

  <path class="ln"  d="M298,76 H336 M298,124 H336 M336,76 V124"/>
  <text class="node" x="344" y="90">V_in</text>
  <path class="arw" d="M336,100 H396"/>

  <rect x="398" y="70" width="196" height="60" rx="8" fill="#f3ecfe" stroke="#7c3aed" stroke-width="1.8"/>
  <text class="ttl" x="496" y="95"  text-anchor="middle">TP5100 CHARGER</text>
  <text class="sub" x="496" y="116" text-anchor="middle">1–2 A Li-ion / LiPo</text>

  <path class="arw" d="M594,100 H654"/>

  <rect x="656" y="70" width="180" height="60" rx="8" fill="#f3ecfe" stroke="#7c3aed" stroke-width="1.8"/>
  <text class="ttl" x="746" y="95"  text-anchor="middle">LiPo BATTERY</text>
  <text class="sub" x="746" y="116" text-anchor="middle">JST-PH 2-pin</text>

  <!-- battery powers the board -->
  <path class="ln"  d="M836,100 H944 V196 H510"/>
  <path class="arw" d="M510,196 V212"/>
  <text class="lbl" x="928" y="188" text-anchor="end">the only rail that runs the unit</text>

  <!-- display mainboard -->
  <rect x="230" y="216" width="560" height="148" rx="9" fill="#f3ecfe" stroke="#7c3aed" stroke-width="1.8"/>
  <text class="ttl" x="252" y="244">DISPLAY MAINBOARD</text>
  <text class="sub" x="252" y="274">TPS61023 boost → <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">+5V switched</tspan>  (EN from the button board)</text>
  <text class="sub" x="252" y="300">Arduino Nano ESP32 — SPI out to the panel</text>
  <text class="sub" x="252" y="326">12 V-in divider → A1 · LiPo divider → A0</text>
  <text class="sub" x="252" y="352">CH224K USB-C PD sink</text>

  <path class="arw" d="M510,364 V414"/>
  <text class="lbl" x="522" y="384">2×10 ribbon</text>
  <text class="lbl" x="522" y="401">5 buttons · SPI · 5 V · EN · LED+</text>

  <!-- button board -->
  <rect x="300" y="416" width="420" height="62" rx="9" fill="#f3ecfe" stroke="#7c3aed" stroke-width="1.8"/>
  <text class="ttl" x="510" y="442" text-anchor="middle">BUTTON BOARD</text>
  <text class="sub" x="510" y="463" text-anchor="middle">5 buttons + illuminated power switch (CN2)</text>

  <path class="ln"  d="M510,478 V530 M260,530 H760 M260,530 V550 M760,530 V550"/>
  <path class="arw" d="M260,544 V560"/>
  <path class="arw" d="M760,544 V560"/>
  <text class="lbl" x="522" y="500">1×8 JST-XH</text>
  <text class="lbl" x="522" y="517">BL_PWM · D/C · CS · MOSI · MISO · CLK · Vin · GND</text>

  <rect x="130" y="562" width="260" height="76" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text class="ttl" x="260" y="592" text-anchor="middle">HX8357 MODULE</text>
  <text class="sub" x="260" y="614" text-anchor="middle">direct, no carrier needed</text>

  <text class="lbl" x="510" y="604" text-anchor="middle">…or…</text>

  <rect x="630" y="562" width="280" height="76" rx="9" fill="#f3ecfe" stroke="#7c3aed" stroke-width="1.8"/>
  <text class="ttl" x="770" y="588" text-anchor="middle">LCD CARRIER</text>
  <text class="sub" x="770" y="609" text-anchor="middle">TPS7A0333 3V3 + backlight FET</text>
  <text class="sub" x="770" y="629" text-anchor="middle">40-pin FPC → ST7365P panel</text>
</svg>
